
name: Azure Static Web Apps CI/CD
 
# This is AZURE'S OWN generated workflow, with one addition: the Supabase
# configuration is passed to the build.
#
# Why this rather than a hand-written one: Azure's version deployed
# successfully twice (runs #1 and #2). Three attempts at a custom workflow
# failed for three different reasons - no lock file, Node 18 against a
# dependency tree needing 20+, and the wrong app_location/output_location
# pairing with skip_app_build. Each was a real defect, none was in the
# application, and a deployment is not the place to be clever.
#
# Azure builds the app itself using Oryx, inside the deploy action. Environment
# variables set on that step DO reach the build, which is what makes the
# Supabase config work here.
#
# The test suite is not run here. It runs before pushing, and can be added back
# as a separate job once deployment is settled - a broken deployment is a worse
# problem than an untested one, and mixing the two is what made the last three
# failures hard to read.
 
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
 
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
 
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
 
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
          script: |
            const coredemo = require('@actions/core')
            return await coredemo.getIDToken()
          result-encoding: string
 
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_WAVE_09062AE03 }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/"
          api_location: ""
          output_location: "build"
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
        env:
          # THE ADDITION. Create React App reads REACT_APP_* at BUILD time and
          # bakes the values into the bundle. Azure's "Application settings" in
          # the portal are runtime only and never reach the build, so these have
          # to be GitHub repository secrets passed here.
          #
          # Without them the app deploys, loads, and cannot reach the database:
          # isConfigured is false and nobody can sign in.
          REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
          REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
          # Warnings are not failures. CRA treats them as errors when CI is set,
          # and a deprecation notice in a dependency should not stop a deploy.
          CI: false
 
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_WAVE_09062AE03 }}
          action: "close"
 
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_WAVE_09062AE03 }}
          action: close
